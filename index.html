<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">FP</div>
        <div><strong>FonoPlan</strong><span>Seguimiento individual</span></div>
      </div>
      <nav id="main-nav">
        <button class="nav-item active" data-view="inicio"><span>◰</span> Resumen</button>
        <button class="nav-item" data-view="ficha"><span>○</span> Ficha del estudiante</button>
        <button class="nav-item" data-view="evaluacion"><span>◈</span> Evaluación inicial</button>
        <button class="nav-item" data-view="plan"><span>✓</span> Plan anual</button>
        <button class="nav-item" data-view="sesiones"><span>◷</span> Registro de sesiones</button>
        <button class="nav-item" data-view="informe"><span>≡</span> Informe semestral</button>
      </nav>
      <div class="sidebar-foot">
        <p>Datos guardados solo en este equipo.</p>
        <button class="ghost full" id="backup-btn">Crear respaldo</button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Abrir menú">☰</button>
        <div class="student-switcher">
          <label for="student-select">Estudiante activo</label>
          <select id="student-select"></select>
        </div>
        <div class="top-actions">
          <span class="save-state" id="save-state">Guardado</span>
          <button class="secondary" id="new-student-btn">Nuevo estudiante</button>
        </div>
      </header>

      <section id="view-inicio" class="view active"></section>
      <section id="view-ficha" class="view"></section>
      <section id="view-evaluacion" class="view"></section>
      <section id="view-plan" class="view"></section>
      <section id="view-sesiones" class="view"></section>
      <section id="view-informe" class="view"></section>
    </main>
  </div>

  <dialog id="student-dialog">
    <form method="dialog" id="student-form">
      <div class="dialog-head"><div><span class="eyebrow">Nueva ficha</span><h2>Agregar estudiante</h2></div><button type="button" class="icon-btn" data-close-dialog aria-label="Cerrar">×</button></div>
      <div class="form-grid two">
        <label>Nombre completo<input name="name" required autocomplete="off"></label>
        <label>Curso<input name="course" required autocomplete="off"></label>
        <label>Profesional<input name="professional" value="María José Zamorano Díaz" required autocomplete="off"></label>
        <label>Año<input name="year" type="number" min="2020" max="2100" required></label>
      </div>
      <div class="dialog-actions"><button type="button" data-close-dialog class="ghost">Cancelar</button><button value="default" class="primary" id="create-student-submit">Crear ficha</button></div>
    </form>
  </dialog>

  <dialog id="session-dialog">
    <form method="dialog" id="session-form">
      <div class="dialog-head"><div><span class="eyebrow">Registro clínico</span><h2 id="session-dialog-title">Nueva sesión</h2></div><button type="button" class="icon-btn" data-close-dialog aria-label="Cerrar">×</button></div>
      <input type="hidden" name="id">
      <div class="form-grid two">
        <label>Semestre<select name="semester"><option value="1">Primer semestre</option><option value="2">Segundo semestre</option></select></label>
        <label>Fecha<input name="date" type="date" required></label>
        <label>Hora<input name="time" type="time"></label>
        <label>Duración (minutos)<input name="duration" type="number" min="1" max="240" value="45"></label>
        <label class="wide">Objetivo específico<select name="objectiveId" required></select></label>
        <label>Asistencia<select name="attendance"><option>Presente</option><option>Ausente</option></select></label>
        <label>Nivel de logro<select name="level"><option value="">Sin evaluar</option><option value="L">L · Logrado</option><option value="D">D · En desarrollo</option><option value="NL">NL · No logrado</option></select></label>
        <label>Modalidad<select name="modality"><option>Individual</option><option>Grupal</option><option>Teleatención</option><option>En aula</option></select></label>
        <label>Tipo de apoyo<select name="support"><option value="">No especificado</option><option>Sin apoyo</option><option>Apoyo verbal</option><option>Apoyo visual</option><option>Modelado</option><option>Apoyo gestual</option><option>Apoyo combinado</option></select></label>
        <label class="wide">Actividad o estrategia aplicada<input name="strategy" placeholder="Ej.: discriminación auditiva con pares mínimos"></label>
        <label class="wide">Observaciones<textarea name="notes" rows="4" placeholder="Registre apoyos, respuesta, contexto o acuerdos..."></textarea></label>
      </div>
      <div class="dialog-actions"><button type="button" data-close-dialog class="ghost">Cancelar</button><button value="default" class="primary" id="save-session-submit">Guardar sesión</button></div>
    </form>
  </dialog>

  <input id="restore-input" type="file" accept="application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
(() => {
  'use strict';

  const STORAGE_KEY = 'fonoplan-v2';
  const objectives = window.FONO_OBJECTIVES || [];
  const areas = [...new Set(objectives.map(o => o.area))];
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
  const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const uid = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
  const fmtDate = date => date ? new Intl.DateTimeFormat('es-CL', {day:'2-digit', month:'short', year:'numeric'}).format(new Date(`${date}T12:00:00`)) : 'Sin fecha';
  const today = () => new Date().toISOString().slice(0, 10);
  const levelName = level => ({L:'Logrado', D:'En desarrollo', NL:'No logrado'}[level] || 'Sin evaluar');

  function makeInitialState() {
    const studentId = uid();
    const idByText = new Map(objectives.map(o => [o.text, o.id]));
    const importedPlan = Object.fromEntries(objectives.filter(o => o.s1 || o.s2).map(o => [o.id, {s1:o.s1, s2:o.s2}]));
    [
      ['Potenciar las habilidades de función ejecutiva', 's1'],
      ['Potenciar las habilidades de memoria', 's2'],
      ['Aumentar la capacidad de memoria secuencial auditiva', 's2']
    ].forEach(([text, semester]) => {
      const id = idByText.get(text);
      if (id) importedPlan[id] = {...(importedPlan[id] || {s1:false,s2:false}), [semester]:true};
    });
    return {
      version: 1,
      activeStudentId: studentId,
      ui: {view:'inicio', planSemester:'all', sessionSemester:'1', reportSemester:'1', reportMode:'latest'},
      students: [{
        id: studentId,
        name: 'Zamara Nauto',
        course: 'Kinder',
        professional: 'María José Zamorano Díaz',
        year: 2026,
        identifier: '',
        birthDate: '',
        school: '',
        referralReason: '',
        clinicalBackground: '',
        diagnosticImpression: '',
        evaluationDate: '',
        baseline: {},
        notes: '',
        plan: importedPlan,
        sessions: [
          {id:uid(), semester:1, date:'', objectiveId:idByText.get('Lograr la emisión y generalización de todos los fonemas dentales'), attendance:'Presente', level:'D', notes:'Registro importado desde el Excel.'},
          {id:uid(), semester:1, date:'', objectiveId:idByText.get('Potenciar las habilidades de función ejecutiva'), attendance:'Presente', level:'L', notes:'Registro importado desde el Excel.'},
          {id:uid(), semester:2, date:'', objectiveId:idByText.get('Potenciar las habilidades de memoria'), attendance:'Presente', level:'D', notes:'Registro importado desde el Excel.'},
          {id:uid(), semester:2, date:'', objectiveId:idByText.get('Aumentar la capacidad de memoria secuencial auditiva'), attendance:'Presente', level:'L', notes:'Registro importado desde el Excel.'}
        ]
      }]
    };
  }

  function normalizeState(saved) {
    saved.version = 2;
    saved.ui = {...{view:'inicio',planSemester:'all',sessionSemester:'1',reportSemester:'1',reportMode:'latest',evaluationArea:'all',evaluationSearch:''}, ...(saved.ui || {})};
    saved.students = (saved.students || []).map(s => ({
      identifier:'', birthDate:'', school:'', referralReason:'', clinicalBackground:'', diagnosticImpression:'', evaluationDate:'', baseline:{}, notes:'', plan:{}, sessions:[],
      ...s,
      baseline:s.baseline || {}, plan:s.plan || {},
      sessions:(s.sessions || []).map(x => ({time:'',duration:45,modality:'Individual',support:'',strategy:'',notes:'',...x}))
    }));
    if (!saved.activeStudentId || !saved.students.some(s => s.id === saved.activeStudentId)) saved.activeStudentId = saved.students[0]?.id;
    return saved;
  }

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved?.students?.length) return normalizeState(saved);
    } catch (_) {}
    return normalizeState(makeInitialState());
  }

  let state = loadState();
  let saveTimer;
  const activeStudent = () => state.students.find(s => s.id === state.activeStudentId) || state.students[0];
  const getObjective = id => objectives.find(o => o.id === id);

  function save(message = 'Guardado') {
    $('#save-state').textContent = 'Guardando…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        $('#save-state').textContent = message;
      } catch (_) {
        $('#save-state').textContent = 'No se pudo guardar';
        toast('No hay espacio suficiente para guardar. Cree un respaldo.');
      }
    }, 180);
  }

  function toast(message) {
    const el = $('#toast');
    el.textContent = message;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2300);
  }

  function planned(student, semester) {
    return objectives.filter(o => student.plan[o.id]?.[`s${semester}`]);
  }

  function objectiveResult(student, objectiveId, semester, mode = 'latest') {
    const entries = student.sessions.filter(s => Number(s.semester) === Number(semester) && s.objectiveId === objectiveId && s.attendance === 'Presente' && s.level);
    if (!entries.length) return '';
    if (mode === 'best') return entries.some(s => s.level === 'L') ? 'L' : entries.some(s => s.level === 'D') ? 'D' : 'NL';
    return [...entries].sort((a,b) => (a.date || '').localeCompare(b.date || '') || a.id.localeCompare(b.id)).at(-1).level;
  }

  function stats(student, semester, mode = 'latest') {
    const selected = planned(student, semester);
    const results = selected.map(o => ({objective:o, level:objectiveResult(student, o.id, semester, mode)}));
    const counts = {L:0,D:0,NL:0,blank:0};
    results.forEach(r => counts[r.level || 'blank']++);
    const evaluated = counts.L + counts.D + counts.NL;
    return {selected, results, counts, evaluated, achieved:evaluated ? Math.round(counts.L / evaluated * 100) : 0};
  }

  function baselineStats(student) {
    const counts = {L:0,D:0,NL:0,NE:0};
    objectives.forEach(o => counts[student.baseline[o.id]?.level || 'NE']++);
    const evaluated = counts.L + counts.D + counts.NL;
    return {counts,evaluated,coverage:Math.round(evaluated/objectives.length*100)};
  }

  function ageAt(date) {
    if (!date) return '';
    const born = new Date(`${date}T12:00:00`), now = new Date();
    let years = now.getFullYear()-born.getFullYear();
    if (now < new Date(now.getFullYear(),born.getMonth(),born.getDate())) years--;
    return years >= 0 ? `${years} años` : '';
  }

  function renderStudentSelect() {
    $('#student-select').innerHTML = state.students.map(s => `<option value="${s.id}" ${s.id === state.activeStudentId ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  }

  function pageHead(kicker, title, description, actions = '') {
    return `<div class="page-head"><div><span class="eyebrow">${kicker}</span><h1>${title}</h1><p>${description}</p></div><div class="head-actions screen-only">${actions}</div></div>`;
  }

  function renderHome() {
    const s = activeStudent();
    const semester = Number(state.ui.reportSemester || 1);
    const st = stats(s, semester);
    const present = s.sessions.filter(x => x.attendance === 'Presente').length;
    const total = s.sessions.length;
    const attendance = total ? Math.round(present / total * 100) : 0;
    const baseline = baselineStats(s);
    const recent = [...s.sessions].sort((a,b) => (b.date || '').localeCompare(a.date || '')).slice(0,5);
    const areaRows = areas.map(area => {
      const rs = st.results.filter(r => r.objective.area === area);
      const done = rs.filter(r => r.level === 'L').length;
      const evald = rs.filter(r => r.level).length;
      const pct = evald ? Math.round(done/evald*100) : 0;
      return rs.length ? `<div class="area-progress"><span>${esc(area.replaceAll('_',' '))}</span><div class="bar"><i style="width:${pct}%"></i></div><b>${pct}%</b></div>` : '';
    }).join('');
    $('#view-inicio').innerHTML = `
      <div class="card hero">
        <div><span class="eyebrow">Resumen ${semester === 1 ? 'primer' : 'segundo'} semestre</span><h1>${esc(s.name)}</h1><p>Revise la planificación, registre cada sesión y genere el informe de avance desde un solo lugar.</p><div class="hero-actions screen-only"><button class="primary" data-action="new-session">Registrar sesión</button><button class="ghost" data-go="plan">Revisar plan</button></div></div>
        <div class="hero-metric"><div class="progress-ring" style="--progress:${st.achieved}"><div><strong>${st.achieved}%</strong><span>objetivos logrados</span></div></div></div>
      </div>
      <div class="metrics">
        <div class="card metric"><span class="label">Objetivos planificados</span><strong>${st.selected.length}</strong><small>Semestre ${semester}</small></div>
        <div class="card metric"><span class="label">Objetivos evaluados</span><strong>${st.evaluated}</strong><small>${st.counts.blank} pendientes</small></div>
        <div class="card metric"><span class="label">Sesiones registradas</span><strong>${s.sessions.length}</strong><small>Ambos semestres</small></div>
        <div class="card metric"><span class="label">Asistencia</span><strong>${attendance}%</strong><small>${present} de ${total || 0} registros</small></div>
        <div class="card metric"><span class="label">Evaluación inicial</span><strong>${baseline.coverage}%</strong><small>${baseline.evaluated} de ${objectives.length} objetivos</small></div>
      </div>
      <div class="dashboard-grid">
        <div class="card"><h2>Avance por área</h2><p class="subtle">Porcentaje de objetivos logrados entre los evaluados.</p><div class="area-list">${areaRows || '<div class="empty">Seleccione objetivos en el plan anual para ver el avance.</div>'}</div></div>
        <div class="card"><h2>Actividad reciente</h2><p class="subtle">Últimos registros de seguimiento.</p><div class="activity-list">${recent.length ? recent.map(x => { const o=getObjective(x.objectiveId); return `<div class="activity"><div class="date-box">${x.date ? esc(x.date.slice(5).replace('-','/')) : '—'}</div><div><b>${esc(o?.text || 'Objetivo eliminado')}</b><small>${esc(x.attendance)} · ${levelName(x.level)}</small></div><span class="pill ${x.level || 'blank'}">${x.level || '—'}</span></div>`; }).join('') : '<div class="empty">Aún no hay sesiones.</div>'}</div></div>
      </div>`;
  }

  function renderProfile() {
    const s = activeStudent();
    $('#view-ficha').innerHTML = `${pageHead('Antecedentes','Ficha del estudiante','Estos datos aparecen en la planificación y en los informes.')}
      <div class="card form-card">
        <form id="profile-form" class="form-grid two">
          <label>Nombre completo<input name="name" value="${esc(s.name)}" required></label>
          <label>Curso<input name="course" value="${esc(s.course)}" required></label>
          <label>RUN o identificador<input name="identifier" value="${esc(s.identifier || '')}" placeholder="Opcional"></label>
          <label>Fecha de nacimiento<input name="birthDate" type="date" value="${esc(s.birthDate || '')}"></label>
          <label>Establecimiento<input name="school" value="${esc(s.school || '')}"></label>
          <label>Profesional responsable<input name="professional" value="${esc(s.professional)}" required></label>
          <label>Año<input name="year" type="number" min="2020" max="2100" value="${esc(s.year)}" required></label>
          <label class="wide">Motivo de derivación o consulta<textarea name="referralReason" rows="3">${esc(s.referralReason || '')}</textarea></label>
          <label class="wide">Antecedentes clínicos y educativos relevantes<textarea name="clinicalBackground" rows="4">${esc(s.clinicalBackground || '')}</textarea></label>
          <label class="wide">Impresión diagnóstica profesional<textarea name="diagnosticImpression" rows="4" placeholder="Consigne conclusiones profesionales. El sistema no genera diagnósticos automáticos.">${esc(s.diagnosticImpression || '')}</textarea></label>
          <label class="wide">Antecedentes u observaciones generales<textarea name="notes" rows="5">${esc(s.notes || '')}</textarea></label>
          <div class="wide head-actions"><button class="primary" type="submit">Guardar cambios</button><button class="secondary" type="button" id="restore-btn">Importar respaldo</button></div>
        </form>
        <div class="danger-zone"><div><strong>Eliminar ficha</strong><div class="subtle">Se borrarán su planificación y registros en este equipo.</div></div><button class="danger" id="delete-student-btn">Eliminar</button></div>
      </div>`;
  }

  function renderEvaluation() {
    const s = activeStudent();
    const bs = baselineStats(s);
    const search = state.ui.evaluationSearch || '';
    const areaFilter = state.ui.evaluationArea || 'all';
    const filtered = objectives.filter(o => (areaFilter === 'all' || o.area === areaFilter) && (!search || o.text.toLowerCase().includes(search.toLowerCase())));
    const groups = areas.map(area => {
      const rows = filtered.filter(o => o.area === area);
      if (!rows.length) return '';
      const evaluated = rows.filter(o => s.baseline[o.id]?.level).length;
      return `<div class="card plan-group"><div class="plan-group-head"><h3>${esc(area.replaceAll('_',' '))}</h3><span>${evaluated} de ${rows.length} evaluados</span></div>${rows.map(o => {
        const level = s.baseline[o.id]?.level || '';
        return `<div class="evaluation-row"><span>${esc(o.text)}</span><select data-baseline="${o.id}" aria-label="Resultado inicial: ${esc(o.text)}"><option value="" ${!level?'selected':''}>No evaluado</option><option value="L" ${level==='L'?'selected':''}>Logrado / fortaleza</option><option value="D" ${level==='D'?'selected':''}>En desarrollo</option><option value="NL" ${level==='NL'?'selected':''}>No logrado / prioridad</option></select></div>`;
      }).join('')}</div>`;
    }).join('');
    $('#view-evaluacion').innerHTML = `${pageHead('Línea de base','Evaluación inicial','Registre el desempeño observado antes de definir el plan. Esta sección organiza el juicio profesional, no lo reemplaza.', '<button class="secondary" data-prioritize="2">Planificar prioridades en S2</button><button class="primary" data-prioritize="1">Planificar prioridades en S1</button>')}
      <div class="clinical-note"><strong>Uso profesional:</strong> marque solo objetivos efectivamente evaluados. Los objetivos “En desarrollo” y “No logrado” pueden incorporarse al plan con los botones superiores.</div>
      <div class="evaluation-layout">
        <aside class="card evaluation-summary"><span class="eyebrow">Cobertura</span><span class="summary-number">${bs.coverage}%</span><div class="subtle">${bs.evaluated} de ${objectives.length} objetivos evaluados</div><div class="coverage"><i style="width:${bs.coverage}%"></i></div><div class="legend"><div><span>Fortalezas / logrados</span><b>${bs.counts.L}</b></div><div><span>En desarrollo</span><b>${bs.counts.D}</b></div><div><span>Prioridades</span><b>${bs.counts.NL}</b></div><div><span>No evaluados</span><b>${bs.counts.NE}</b></div></div><label style="display:grid;gap:7px;margin-top:20px;font-size:12px;font-weight:800">Fecha de evaluación<input id="evaluation-date" type="date" value="${esc(s.evaluationDate || '')}" style="border:1px solid #cedbd8;border-radius:9px;padding:9px"></label></aside>
        <div><div class="filter-row" style="grid-template-columns:1fr 220px"><input id="evaluation-search" type="search" placeholder="Buscar objetivo…" value="${esc(search)}"><select id="evaluation-area"><option value="all">Todas las áreas</option>${areas.map(a=>`<option value="${esc(a)}" ${areaFilter===a?'selected':''}>${esc(a.replaceAll('_',' '))}</option>`).join('')}</select></div>${groups || '<div class="empty">No hay resultados para estos filtros.</div>'}</div>
      </div>`;
  }

  function renderPlan() {
    const s = activeStudent();
    const search = state.ui.planSearch || '';
    const areaFilter = state.ui.planArea || 'all';
    const semesterFilter = state.ui.planSemester || 'all';
    const filtered = objectives.filter(o => (areaFilter === 'all' || o.area === areaFilter) && (!search || o.text.toLowerCase().includes(search.toLowerCase())) && (semesterFilter === 'all' || s.plan[o.id]?.[`s${semesterFilter}`]));
    const groups = areas.map(area => {
      const rows = filtered.filter(o => o.area === area);
      if (!rows.length) return '';
      const selected = rows.filter(o => s.plan[o.id]?.s1 || s.plan[o.id]?.s2).length;
      return `<div class="card plan-group"><div class="plan-group-head"><h3>${esc(area.replaceAll('_',' '))}</h3><span>${selected} seleccionados</span></div>${rows.map(o => `<div class="objective-row"><span>${esc(o.text)}</span><label class="semester-toggle"><input type="checkbox" data-objective="${o.id}" data-semester="1" ${s.plan[o.id]?.s1 ? 'checked' : ''}> 1er sem.</label><label class="semester-toggle"><input type="checkbox" data-objective="${o.id}" data-semester="2" ${s.plan[o.id]?.s2 ? 'checked' : ''}> 2do sem.</label></div>`).join('')}</div>`;
    }).join('');
    $('#view-plan').innerHTML = `${pageHead('Planificación','Plan anual','Seleccione los objetivos específicos que se trabajarán en cada semestre.', '<button class="secondary" id="clear-plan-btn">Limpiar filtros</button>')}
      <div class="filter-row"><input id="plan-search" type="search" placeholder="Buscar entre 136 objetivos…" value="${esc(search)}"><select id="plan-area"><option value="all">Todas las áreas</option>${areas.map(a=>`<option value="${esc(a)}" ${areaFilter===a?'selected':''}>${esc(a.replaceAll('_',' '))}</option>`).join('')}</select><select id="plan-semester"><option value="all">Todos los objetivos</option><option value="1" ${semesterFilter==='1'?'selected':''}>Seleccionados S1</option><option value="2" ${semesterFilter==='2'?'selected':''}>Seleccionados S2</option></select></div>
      ${groups || '<div class="empty">No hay objetivos que coincidan con los filtros.</div>'}`;
  }

  function renderSessions() {
    const s = activeStudent();
    const semester = Number(state.ui.sessionSemester || 1);
    const rows = [...s.sessions].filter(x => Number(x.semester) === semester).sort((a,b) => (b.date || '').localeCompare(a.date || ''));
    $('#view-sesiones').innerHTML = `${pageHead('Seguimiento','Registro de sesiones','Equivale a las hojas S1 y S2 del Excel, sin el límite de 50 registros.', '<button class="primary" data-action="new-session">Nueva sesión</button>')}
      <div class="tabs"><button class="tab-btn ${semester===1?'active':''}" data-session-sem="1">Primer semestre</button><button class="tab-btn ${semester===2?'active':''}" data-session-sem="2">Segundo semestre</button></div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>Fecha</th><th>Objetivo específico</th><th>Asistencia</th><th>Nivel</th><th>Intervención y observaciones</th><th></th></tr></thead><tbody>${rows.length ? rows.map(x => { const o=getObjective(x.objectiveId); return `<tr><td>${fmtDate(x.date)}${x.time?`<div class="subtle">${esc(x.time)} hrs.</div>`:''}</td><td><strong>${esc(o?.text || 'Objetivo no disponible')}</strong><div class="subtle">${esc(o?.area?.replaceAll('_',' ') || '')}</div><div class="session-meta"><span>${esc(x.modality || 'Individual')}</span><span>${esc(x.duration || 45)} min</span>${x.support?`<span>${esc(x.support)}</span>`:''}</div></td><td>${esc(x.attendance)}</td><td><span class="pill ${x.level || 'blank'}">${x.level ? `${x.level} · ${levelName(x.level)}` : 'Sin evaluar'}</span></td><td>${x.strategy?`<strong>${esc(x.strategy)}</strong><br>`:''}${esc(x.notes || '—')}</td><td><div class="row-actions"><button class="icon-btn" data-edit-session="${x.id}" title="Editar" aria-label="Editar sesión">✎</button><button class="icon-btn" data-delete-session="${x.id}" title="Eliminar" aria-label="Eliminar sesión">×</button></div></td></tr>`; }).join('') : '<tr><td colspan="6"><div class="empty">No hay sesiones registradas en este semestre.</div></td></tr>'}</tbody></table></div>`;
  }

  function narrative(student, semester, st) {
    if (!st.evaluated) return 'Aún no hay objetivos evaluados para generar una síntesis de avance.';
    const byArea = areas.map(area => {
      const rs = st.results.filter(r => r.objective.area === area && r.level);
      return {area, count:rs.length, l:rs.filter(r => r.level==='L').length, nl:rs.filter(r => r.level==='NL').length};
    }).filter(x => x.count);
    const strength = [...byArea].sort((a,b)=>(b.l/b.count)-(a.l/a.count))[0];
    const support = [...byArea].sort((a,b)=>(b.nl/b.count)-(a.nl/a.count))[0];
    let text = `Durante el ${semester === 1 ? 'primer' : 'segundo'} semestre se evaluaron ${st.evaluated} de ${st.selected.length} objetivos planificados. ${st.counts.L} se encuentran logrados, ${st.counts.D} en desarrollo y ${st.counts.NL} no logrados.`;
    if (strength?.l) text += ` El mayor avance relativo se observa en ${strength.area.replaceAll('_',' ')}.`;
    if (support?.nl) text += ` Se sugiere mantener apoyos y seguimiento en ${support.area.replaceAll('_',' ')}.`;
    return text;
  }

  function renderReport() {
    const s = activeStudent();
    const semester = Number(state.ui.reportSemester || 1);
    const mode = state.ui.reportMode || 'latest';
    const st = stats(s, semester, mode);
    const grouped = areas.map(area => {
      const rs=st.results.filter(r=>r.objective.area===area);
      return rs.length ? `<div class="report-area"><h3>${esc(area.replaceAll('_',' '))}</h3>${rs.map(r=>{const initial=s.baseline[r.objective.id]?.level||'';return `<div class="report-objective"><span>${esc(r.objective.text)}${initial?`<small class="subtle" style="display:block">Línea de base: ${levelName(initial)}</small>`:''}</span><span class="pill ${r.level || 'blank'}">${r.level ? levelName(r.level) : 'Sin evaluar'}</span></div>`;}).join('')}</div>` : '';
    }).join('');
    const pct = key => st.evaluated ? Math.round(st.counts[key]/st.evaluated*100) : 0;
    $('#view-informe').innerHTML = `${pageHead('Resultados','Informe semestral','Vista lista para imprimir o guardar como PDF.', '<button class="secondary" id="export-csv-btn">Exportar CSV</button><button class="primary" id="print-report-btn">Imprimir / PDF</button>')}
      <div class="screen-only" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px"><div class="tabs" style="margin:0"><button class="tab-btn ${semester===1?'active':''}" data-report-sem="1">Primer semestre</button><button class="tab-btn ${semester===2?'active':''}" data-report-sem="2">Segundo semestre</button></div><label class="subtle">Cálculo del resultado: <select id="report-mode"><option value="latest" ${mode==='latest'?'selected':''}>Última evaluación</option><option value="best" ${mode==='best'?'selected':''}>Mejor logro (como Excel)</option></select></label></div>
      <article class="report-sheet">
        <div class="report-title"><h1>Informe fonoaudiológico de avance</h1></div>
        <div class="report-meta"><span><strong>Alumno:</strong> ${esc(s.name)}</span><span><strong>Curso:</strong> ${esc(s.course)}</span><span><strong>Identificador:</strong> ${esc(s.identifier || 'No consignado')}</span><span><strong>Edad:</strong> ${esc(ageAt(s.birthDate) || 'No consignada')}</span><span><strong>Establecimiento:</strong> ${esc(s.school || 'No consignado')}</span><span><strong>Profesional:</strong> ${esc(s.professional)}</span><span><strong>Año:</strong> ${esc(s.year)}</span><span><strong>Período:</strong> ${semester===1?'Primer':'Segundo'} semestre</span><span><strong>Fecha evaluación inicial:</strong> ${s.evaluationDate?fmtDate(s.evaluationDate):'No consignada'}</span><span><strong>Criterio:</strong> ${mode==='latest'?'Última evaluación':'Mejor logro registrado'}</span></div>
        ${(s.referralReason||s.diagnosticImpression)?`<div class="report-clinical">${s.referralReason?`<div><strong>Motivo de derivación</strong>${esc(s.referralReason)}</div>`:''}${s.diagnosticImpression?`<div><strong>Impresión diagnóstica</strong>${esc(s.diagnosticImpression)}</div>`:''}</div>`:''}
        <p class="report-intro">${esc(narrative(s,semester,st))}</p>
        <p class="report-intro">Se registraron <strong>${s.sessions.filter(x=>Number(x.semester)===semester).length}</strong> sesiones en el período, con <strong>${s.sessions.filter(x=>Number(x.semester)===semester&&x.attendance==='Presente').length}</strong> asistencias.</p>
        <div class="result-grid"><div class="result-box L"><strong>${pct('L')}%</strong>Contenidos logrados</div><div class="result-box D"><strong>${pct('D')}%</strong>En desarrollo</div><div class="result-box NL"><strong>${pct('NL')}%</strong>No logrados</div></div>
        ${grouped || '<div class="empty">No hay objetivos planificados para este semestre.</div>'}
        <div class="report-notes"><strong>Observaciones y/o sugerencias</strong><p>${esc(s.notes || 'Sin observaciones generales registradas.')}</p></div>
        <div class="signature">Firma y timbre<br>${esc(s.professional)}</div>
      </article>`;
  }

  function render() {
    renderStudentSelect();
    renderHome(); renderProfile(); renderEvaluation(); renderPlan(); renderSessions(); renderReport();
    $$('.view').forEach(v => v.classList.toggle('active', v.id === `view-${state.ui.view}`));
    $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === state.ui.view));
  }

  function go(view) {
    state.ui.view = view;
    render(); save();
    window.scrollTo({top:0, behavior:'smooth'});
    $('.sidebar').classList.remove('open');
  }

  function openSession(session = null) {
    const form = $('#session-form');
    form.reset();
    form.elements.id.value = session?.id || '';
    form.elements.semester.value = session?.semester || state.ui.sessionSemester || 1;
    form.elements.date.value = session?.date || today();
    form.elements.time.value = session?.time || '';
    form.elements.duration.value = session?.duration || 45;
    populateObjectiveOptions(form.elements.semester.value, session?.objectiveId);
    form.elements.attendance.value = session?.attendance || 'Presente';
    form.elements.level.value = session?.level || '';
    form.elements.modality.value = session?.modality || 'Individual';
    form.elements.support.value = session?.support || '';
    form.elements.strategy.value = session?.strategy || '';
    form.elements.notes.value = session?.notes || '';
    form.elements.level.disabled = form.elements.attendance.value === 'Ausente';
    $('#session-dialog-title').textContent = session ? 'Editar sesión' : 'Nueva sesión';
    $('#session-dialog').showModal();
  }

  function populateObjectiveOptions(semester, selected = '') {
    const list = planned(activeStudent(), semester);
    const source = list.length ? list : objectives;
    $('#session-form').elements.objectiveId.innerHTML = `<option value="">Seleccione un objetivo…</option>${source.map(o=>`<option value="${o.id}" ${o.id===selected?'selected':''}>${esc(o.area.replaceAll('_',' '))} · ${esc(o.text)}</option>`).join('')}`;
  }

  function createBackup() {
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `fonoplan-respaldo-${today()}.json`; a.click(); URL.revokeObjectURL(a.href); toast('Respaldo creado');
  }

  function exportCsv() {
    const s=activeStudent(), sem=Number(state.ui.reportSemester||1), st=stats(s,sem,state.ui.reportMode);
    const rows=[['Estudiante','Curso','Año','Semestre','Área','Objetivo','Resultado'],...st.results.map(r=>[s.name,s.course,s.year,sem,r.objective.area,r.objective.text,levelName(r.level)])];
    const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(';')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`informe-${s.name.toLowerCase().replace(/[^a-z0-9]+/gi,'-')}-s${sem}.csv`; a.click(); URL.revokeObjectURL(a.href);
  }

  document.addEventListener('click', e => {
    const nav=e.target.closest('[data-view]'); if(nav){go(nav.dataset.view);return;}
    const direct=e.target.closest('[data-go]'); if(direct){go(direct.dataset.go);return;}
    if(e.target.closest('#menu-btn')) $('.sidebar').classList.toggle('open');
    const closeDialog=e.target.closest('[data-close-dialog]'); if(closeDialog){closeDialog.closest('dialog')?.close();return;}
    if(e.target.closest('#new-student-btn')) { $('#student-form').reset(); $('#student-form').elements.year.value=new Date().getFullYear(); $('#student-dialog').showModal(); }
    if(e.target.closest('[data-action="new-session"]')) openSession();
    const ss=e.target.closest('[data-session-sem]'); if(ss){state.ui.sessionSemester=ss.dataset.sessionSem;render();save();}
    const rs=e.target.closest('[data-report-sem]'); if(rs){state.ui.reportSemester=rs.dataset.reportSem;render();save();}
    const edit=e.target.closest('[data-edit-session]'); if(edit){openSession(activeStudent().sessions.find(x=>x.id===edit.dataset.editSession));}
    const del=e.target.closest('[data-delete-session]'); if(del && confirm('¿Eliminar este registro de sesión?')){const s=activeStudent();s.sessions=s.sessions.filter(x=>x.id!==del.dataset.deleteSession);render();save();toast('Sesión eliminada');}
    if(e.target.closest('#backup-btn')) createBackup();
    if(e.target.closest('#restore-btn')) $('#restore-input').click();
    if(e.target.closest('#print-report-btn')) window.print();
    if(e.target.closest('#export-csv-btn')) exportCsv();
    if(e.target.closest('#clear-plan-btn')){state.ui.planSearch='';state.ui.planArea='all';state.ui.planSemester='all';render();}
    const prioritize=e.target.closest('[data-prioritize]'); if(prioritize){
      const sem=`s${prioritize.dataset.prioritize}`, s=activeStudent(); let added=0;
      objectives.forEach(o=>{const level=s.baseline[o.id]?.level;if(level==='D'||level==='NL'){s.plan[o.id]=s.plan[o.id]||{s1:false,s2:false};if(!s.plan[o.id][sem]){s.plan[o.id][sem]=true;added++;}}});
      render();save();toast(`${added} prioridades agregadas al semestre ${prioritize.dataset.prioritize}`);
    }
    if(e.target.closest('#delete-student-btn')){
      if(state.students.length===1){alert('Debe existir al menos una ficha. Cree otra antes de eliminar esta.');return;}
      if(confirm(`¿Eliminar la ficha de ${activeStudent().name}? Esta acción no se puede deshacer.`)){state.students=state.students.filter(x=>x.id!==state.activeStudentId);state.activeStudentId=state.students[0].id;go('inicio');toast('Ficha eliminada');}
    }
  });

  document.addEventListener('change', e => {
    if(e.target.id==='student-select'){state.activeStudentId=e.target.value;render();save();}
    if(e.target.matches('[data-objective]')){const s=activeStudent(),id=e.target.dataset.objective,key=`s${e.target.dataset.semester}`;s.plan[id]=s.plan[id]||{s1:false,s2:false};s.plan[id][key]=e.target.checked;save();renderHome();renderReport();}
    if(e.target.id==='plan-area'){state.ui.planArea=e.target.value;renderPlan();}
    if(e.target.id==='plan-semester'){state.ui.planSemester=e.target.value;renderPlan();}
    if(e.target.id==='report-mode'){state.ui.reportMode=e.target.value;renderReport();save();}
    if(e.target.name==='semester' && e.target.closest('#session-form')) populateObjectiveOptions(e.target.value);
    if(e.target.name==='attendance' && e.target.closest('#session-form')){const level=$('#session-form').elements.level;level.disabled=e.target.value==='Ausente';if(level.disabled)level.value='';}
    if(e.target.matches('[data-baseline]')){const s=activeStudent(),id=e.target.dataset.baseline;if(e.target.value)s.baseline[id]={...(s.baseline[id]||{}),level:e.target.value};else delete s.baseline[id];renderEvaluation();renderReport();save();}
    if(e.target.id==='evaluation-area'){state.ui.evaluationArea=e.target.value;renderEvaluation();}
    if(e.target.id==='evaluation-date'){activeStudent().evaluationDate=e.target.value;save();renderReport();}
  });

  document.addEventListener('input', e => {
    if(e.target.id==='plan-search'){state.ui.planSearch=e.target.value;renderPlan();const input=$('#plan-search');input.focus();input.setSelectionRange(input.value.length,input.value.length);}
    if(e.target.id==='evaluation-search'){state.ui.evaluationSearch=e.target.value;renderEvaluation();const input=$('#evaluation-search');input.focus();input.setSelectionRange(input.value.length,input.value.length);}
  });

  $('#profile-form')?.addEventListener('submit', () => {});
  document.addEventListener('submit', e => {
    e.preventDefault();
    if(e.target.id==='profile-form'){
      const data=Object.fromEntries(new FormData(e.target)); Object.assign(activeStudent(),data,{year:Number(data.year)}); render();save();toast('Ficha actualizada');
    }
    if(e.target.id==='student-form'){
      const data=Object.fromEntries(new FormData(e.target)); if(!data.name||!data.course||!data.professional)return;
      const item={id:uid(),name:data.name.trim(),course:data.course.trim(),professional:data.professional.trim(),year:Number(data.year),identifier:'',birthDate:'',school:'',referralReason:'',clinicalBackground:'',diagnosticImpression:'',evaluationDate:'',baseline:{},notes:'',plan:{},sessions:[]}; state.students.push(item);state.activeStudentId=item.id;$('#student-dialog').close();go('ficha');toast('Ficha creada');
    }
    if(e.target.id==='session-form'){
      const data=Object.fromEntries(new FormData(e.target)); if(!data.date||!data.objectiveId)return;
      const s=activeStudent(), item={id:data.id||uid(),semester:Number(data.semester),date:data.date,time:data.time||'',duration:Number(data.duration)||45,objectiveId:data.objectiveId,attendance:data.attendance,level:data.attendance==='Ausente'?'':data.level,modality:data.modality||'Individual',support:data.support||'',strategy:data.strategy.trim(),notes:data.notes.trim()};
      const i=s.sessions.findIndex(x=>x.id===item.id); if(i>=0)s.sessions[i]=item;else s.sessions.push(item); state.ui.sessionSemester=String(item.semester);$('#session-dialog').close();render();save();toast(i>=0?'Sesión actualizada':'Sesión registrada');
    }
  });

  $('#restore-input').addEventListener('change', async e => {
    const file=e.target.files[0]; if(!file)return;
    try{const imported=JSON.parse(await file.text());if(!imported.students?.length)throw new Error();if(confirm('¿Reemplazar los datos actuales por este respaldo?')){state=normalizeState(imported);render();save('Respaldo restaurado');toast('Respaldo restaurado');}}catch(_){alert('El archivo no es un respaldo válido de FonoPlan.');} e.target.value='';
  });

  render();
})();

  </script>
</body>
</html>
